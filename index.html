<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storm Area 51 · Find your raider</title>
<meta name="description" content="Type your Instagram @ and see your Area 51 raider, job and wave.">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<style>
  :root { --brown: #3A2412; --gold: #F5C542; --red: #c0392b; }
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background: #2a1610; color: #fff; overflow-x: hidden; font-family: "Arial Rounded MT Bold", "Nunito", ui-rounded, system-ui, sans-serif; }
  .app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
  header { text-align: center; padding: 16px 16px 6px; }
  .sign { display: inline-block; background: var(--red); border: 4px solid #fff; border-radius: 14px; padding: 8px 20px 6px; box-shadow: 0 6px 0 rgba(0,0,0,.35); transform: rotate(-2deg); }
  .sign h1 { margin: 0; font-size: 34px; letter-spacing: 1px; } .sign div { font-size: 13px; letter-spacing: 2px; }
  .by { color: var(--gold); font-size: 14px; margin-top: 10px; }
  form { display: flex; gap: 8px; padding: 10px 16px; }
  .in { flex: 1; min-width: 0; display: flex; align-items: center; background: #fff; border-radius: 999px; border: 4px solid var(--brown); padding: 0 14px; }
  .in span { color: #9a8a7a; font-size: 20px; }
  input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 18px; padding: 12px 6px; color: #2a1f1a; background: transparent; min-width: 0; }
  button, .btn { font: inherit; font-size: 16px; white-space: nowrap; border: 4px solid var(--brown); border-radius: 999px; padding: 10px 16px; background: var(--gold); color: var(--brown); cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
  .stagewrap { position: relative; width: 100%; aspect-ratio: 4 / 5; max-height: 70vh; margin: 0 auto; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #card { position: relative; margin: -60px 14px 0; background: #FFFDF7; color: var(--brown); border: 5px solid var(--brown); border-radius: 26px; padding: 14px 18px 14px; box-shadow: 0 10px 0 rgba(58,36,18,.35); }
  .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #cid { font-size: 24px; white-space: nowrap; } #cid b { color: #E0A800; }
  .pill { font-size: 12px; padding: 6px 10px; border-radius: 999px; color: #fff; letter-spacing: 1px; white-space: nowrap; background: #8a7a6a; }
  .pill.FrontRunner { background: linear-gradient(90deg,#e0a800,#f5c542); color: #3a2412; } .pill.FenceCrew { background: #ff8a1e; } .pill.DesertArmy { background: #6b6b45; } .pill.SnackDuty { background: #e8352a; }
  #handle { color: var(--red); font-size: 22px; margin-top: 4px; word-break: break-all; }
  #job { font-size: 20px; margin-top: 8px; } .rare { font-size: 12px; background: #3f7cc4; color: #fff; padding: 3px 8px; border-radius: 999px; vertical-align: middle; }
  .legend { font-size: 12px; background: linear-gradient(90deg,#1d1e24,#5bff8a); color: #fff; padding: 3px 8px; border-radius: 999px; vertical-align: middle; }
  #req { font-size: 15px; margin-top: 8px; color: #8134af; }
  #mission { font-size: 15px; color: #7A6656; font-style: italic; margin-top: 3px; } #gear { font-size: 16px; margin-top: 8px; }
  #wait { display: none; color: #2a7dd6; font-size: 15px; margin-top: 8px; } #card.notyet #wait { display: block; } #card.notyet #cid { font-size: 20px; color: #2a7dd6; }
  #actions { display: flex; flex-direction: column; gap: 10px; padding: 16px 14px 8px; }
  #follow { background: linear-gradient(90deg,#f58529,#dd2a7b,#8134af); color: #fff; }
  footer { text-align: center; font-size: 13px; color: #e8b88a; padding: 14px 16px 26px; }
  @media (max-width: 400px) { form button { padding: 10px 12px; font-size: 15px; } .sign h1 { font-size: 28px; } }
  .updated { text-align: center; font-size: 13px; line-height: 1.45; color: #e8b88a; padding: 2px 18px 8px; } .updated b { color: #F5C542; font-weight: normal; } #lastup { display: block; white-space: nowrap; }
</style></head>
<body><div class="app">
  <header><div class="sign"><h1>STORM AREA 51</h1><div>FOLLOW = YOU'RE IN</div></div><div class="by">by @followerverse · find your raider</div></header>
  <form id="form" autocomplete="off"><label class="in"><span>@</span><input id="who" placeholder="your instagram username" autocapitalize="none" spellcheck="false" maxlength="30"></label><button type="submit">Find my raider</button></form>
  <div id="updated" class="updated"><b>🕒 IDs update once a day</b><span id="lastup"></span>Just followed? Your ID shows up after the next update.</div>
  <div class="stagewrap"><canvas id="gl"></canvas></div>
  <div id="card" hidden>
    <div class="row1"><div id="cid"></div><div id="wave" class="pill"></div></div>
    <div id="handle"></div><div id="job"></div><div id="mission"></div><div id="gear"></div><div id="req" hidden></div><div id="wait"></div>
  </div>
  <div id="actions" hidden>
    <a id="follow" class="btn" target="_blank" rel="noopener">Follow @followerverse to join the raid 🛸</a>
    <button id="save" type="button">Save my Raider ID 📸</button>
  </div>
  <footer>Your job comes from your username: nobody can pick theirs.<br>Comment RAID on the reel 👽</footer>
</div><script>fetch('./raiders.json').then(r => r.json()).then(d => { if (!d.updated) return;
  const t = new Date(d.updated).toLocaleString('en-US', { timeZone: 'America/Chicago', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  document.getElementById('lastup').textContent = 'Last update: ' + t.replace(' AM', ' am').replace(' PM', ' pm') + ' CT'; }).catch(() => {});</script><script type="module" src="./app.js"></script></body></html>
